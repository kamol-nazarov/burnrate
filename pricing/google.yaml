# 2026-12-31; standard $1.50 / $0.15 / $7.50 from 2027-01-01.
# Google bills cache storage hourly ($0.50 / 1M tokens / hour intro;
# $1.00 from 2027-01-01), not a per-MTok cache write. This product does not
# invent OpenRouter's $0.04167 write as a Google SKU; cache writes are not a
# billed per-token class (0). Antigravity is subscription usage, so this is
# value attribution, not a bill.
