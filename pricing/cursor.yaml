# Derived pricing for Cursor models from official Cursor model documentation.
# https://cursor.com/docs/models-and-pricing
# First-party Cursor models list no cache-write fee ("-"), so cache writes are
# not a billed class (0). Cursor documents no long-context tier for its Grok
# variant (its 4/1/12 row is the separate Fast speed variant), so none is
# asserted here. These are published usage rates for included-capacity
# attribution, not metered billing: values are approximate (derived).
provider: cursor
exactness: derived
